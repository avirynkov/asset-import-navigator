name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Breaking changes'
    labels: ['breaking']
  - title: 'Features'
    labels: ['enhancement']
  - title: 'Fixes'
    labels: ['bug', 'regression', 'security']
  - title: 'Compatibility'
    labels: ['compatibility']
  - title: 'Performance'
    labels: ['performance']
  - title: 'Documentation'
    labels: ['documentation']
  - title: 'Dependencies'
    labels: ['dependencies']
exclude-labels: ['skip-changelog']
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
version-resolver:
  major:
    labels: ['breaking']
  minor:
    labels: ['enhancement']
  default: patch
template: |
  $CHANGES
