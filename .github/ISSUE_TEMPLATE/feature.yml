name: Feature request
description: Suggest support for a new import form, asset type or behavior
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What import or workflow is not supported today? Include an example import line.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not CSS Modules selector navigation (`styles.foo`), which is out of scope.
          required: true
        - label: This does not require executing `vite.config.ts` or other project code.
          required: true
